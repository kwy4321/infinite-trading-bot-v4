# main push → CI 통과 후 Oracle VM 자동 git pull + bot restart
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')) &&
      secrets.DEPLOY_HOST != '' &&
      secrets.DEPLOY_SSH_PRIVATE_KEY != ''
    runs-on: ubuntu-latest
    env:
      INSTALL_DIR: ${{ secrets.DEPLOY_INSTALL_DIR != '' && secrets.DEPLOY_INSTALL_DIR || '/home/ubuntu/infinite-trading-bot-v4' }}
    steps:
      - name: Deploy to VM (git pull + restart)
        uses: appleboy/ssh-action@v1.2.0
        env:
          INSTALL_DIR: ${{ env.INSTALL_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER != '' && secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT != '' && secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: INSTALL_DIR
          script: |
            set -euo pipefail
            cd "$INSTALL_DIR"
            bash scripts/vm_deploy.sh
